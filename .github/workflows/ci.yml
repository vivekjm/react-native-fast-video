name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  fast-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B cpp/build -DRNFV_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build --config Release --parallel
      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure -C Release

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run audit
      - run: npm run typecheck
      - run: npm run build
      - run: npm run benchmark:sample
      - run: npm run benchmark:qoe
      - run: npm run benchmark:predictive
      - run: npm run benchmark:device-sample

  apple-source-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Swift
        run: swiftc -parse ios/*.swift
      - name: Validate podspec syntax
        run: ruby -c ios/ReactNativeFastVideo.podspec

  android-native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - working-directory: example
        run: npm install --ignore-scripts --no-audit --no-fund
      - working-directory: example
        run: npx expo prebuild --platform android --no-install
      - working-directory: example/android
        run: ./gradlew :app:assembleDebug --stacktrace

  apple-native-generation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - working-directory: example
        run: npm install --ignore-scripts --no-audit --no-fund
      - working-directory: example
        run: npx expo prebuild --platform ios --no-install
      - working-directory: example/ios
        run: pod install
