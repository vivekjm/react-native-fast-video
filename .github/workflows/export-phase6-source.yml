name: Export Phase 6 source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create source archive
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='cpp/build*' \
            --exclude='example/android' \
            --exclude='example/ios' \
            -czf /tmp/react-native-fast-video-phase6-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-source
          path: /tmp/react-native-fast-video-phase6-source.tar.gz
          if-no-files-found: error
          retention-days: 1
