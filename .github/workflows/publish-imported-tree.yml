name: Publish imported Phase 1-5 tree

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-imported-tree.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  IMPORT_TREE_SHA: 6cbf1662c2afa4a181693f786ee68c24bf89aa5e

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate and publish imported tree
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const treeSha = process.env.IMPORT_TREE_SHA;

            const treeResponse = await github.rest.git.getTree({
              owner,
              repo,
              tree_sha: treeSha,
              recursive: 'true',
            });

            if (treeResponse.data.truncated) {
              core.setFailed('Imported tree response is truncated; refusing to publish.');
              return;
            }

            const entries = treeResponse.data.tree;
            const paths = new Set(entries.map((entry) => entry.path));
            const exactRequired = [
              'README.md',
              'package.json',
              'expo-module.config.json',
            ];
            const prefixRequired = [
              'src/',
              'android/',
              'ios/',
              'cpp/',
              'docs/',
              'benchmarks/',
              '.github/workflows/',
            ];

            const missingExact = exactRequired.filter((path) => !paths.has(path));
            const missingPrefixes = prefixRequired.filter(
              (prefix) => !entries.some((entry) => entry.path.startsWith(prefix)),
            );

            if (paths.has('.bootstrap')) {
              core.setFailed('Imported tree still contains the temporary .bootstrap file.');
              return;
            }
            if (missingExact.length || missingPrefixes.length) {
              core.setFailed(
                `Imported tree is incomplete. Missing exact: ${missingExact.join(', ') || 'none'}; ` +
                `missing prefixes: ${missingPrefixes.join(', ') || 'none'}`,
              );
              return;
            }

            const readmeEntry = entries.find(
              (entry) => entry.path === 'README.md' && entry.type === 'blob',
            );
            const readmeBlob = await github.rest.git.getBlob({
              owner,
              repo,
              file_sha: readmeEntry.sha,
            });
            const readme = Buffer.from(
              readmeBlob.data.content,
              readmeBlob.data.encoding,
            ).toString('utf8');
            const mermaidCount = (readme.match(/```mermaid/g) || []).length;
            if (mermaidCount < 3) {
              core.setFailed(
                `README architecture validation failed: expected at least 3 Mermaid diagrams, found ${mermaidCount}.`,
              );
              return;
            }

            const current = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main',
            });

            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'feat: publish phases 1-5 native media runtime',
              tree: treeSha,
              parents: [current.data.object.sha],
              author: {
                name: 'Vivek JM',
                email: 'vivekjm77@gmail.com',
                date: new Date().toISOString(),
              },
              committer: {
                name: 'Vivek JM',
                email: 'vivekjm77@gmail.com',
                date: new Date().toISOString(),
              },
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/main',
              sha: commit.data.sha,
              force: false,
            });

            core.notice(`Published imported tree ${treeSha} as commit ${commit.data.sha}.`);
