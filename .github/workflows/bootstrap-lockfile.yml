name: Bootstrap dependency lockfile

on:
  push:
    branches: [feat/phase5-gap-closure]
    paths:
      - '.github/workflows/bootstrap-lockfile.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-phase5-lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase5-gap-closure
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current.'
            exit 0
          fi
          git commit -m 'chore: add reproducible dependency lockfile'
          git push origin HEAD:feat/phase5-gap-closure
