name: Import exact Phase 5 history

on:
  push:
    branches:
      - bootstrap/import-phase5-history
    paths:
      - .github/workflows/import-phase5-history.yml

permissions:
  contents: write

jobs:
  import-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify the signed transport
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://paste.rs/zEvyL.txt \
            --output /tmp/phase5.fast-export.xz.b64

          test "$(wc -c < /tmp/phase5.fast-export.xz.b64)" = "103488"
          echo "3d01202145cb75bd7d7c439463105b56a41a277bd071bdf722ec8c45370a3817  /tmp/phase5.fast-export.xz.b64" | sha256sum --check

          base64 --decode /tmp/phase5.fast-export.xz.b64 > /tmp/phase5.fast-export.xz
          echo "0bd530ec19af341243b841e68d201a2875183b17e8b83bfc71023a77bb41c2d4  /tmp/phase5.fast-export.xz" | sha256sum --check
          xz --test /tmp/phase5.fast-export.xz

      - name: Recreate and validate the exact repository history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/imported
          git init -q /tmp/imported
          xz --decompress --stdout /tmp/phase5.fast-export.xz | git -C /tmp/imported fast-import --quiet

          test "$(git -C /tmp/imported rev-parse main)" = "aca7c097523d361248da9f9ad01cbeb19114c414"
          git -C /tmp/imported fsck --strict

      - name: Publish an exact safety ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/imported
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main:refs/heads/imported-phase5-history

          actual="$(git ls-remote origin refs/heads/imported-phase5-history | cut -f1)"
          test "$actual" = "aca7c097523d361248da9f9ad01cbeb19114c414"

      - name: Wait for guarded promotion to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          expected="aca7c097523d361248da9f9ad01cbeb19114c414"

          for attempt in $(seq 1 90); do
            actual="$(git ls-remote "$remote" refs/heads/main | cut -f1)"
            if [ "$actual" = "$expected" ]; then
              echo "main promoted to $actual"
              exit 0
            fi
            echo "waiting for main promotion ($attempt/90); current=$actual"
            sleep 10
          done

          echo "main was not promoted within the guarded window" >&2
          exit 1

      - name: Remove temporary import refs
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" --delete imported-phase5-history || true
          git push "$remote" --delete bootstrap/import-phase5-history || true
