plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.vivekjm.fastvideo'
version = '0.0.5-alpha.0'

android {
  namespace 'com.vivekjm.fastvideo'

  defaultConfig {
    minSdk 24
    versionCode 1
    versionName '0.0.5-alpha.0'

    externalNativeBuild {
      cmake {
        cppFlags '-std=c++20 -fexceptions -frtti -Wall -Wextra'
        arguments '-DANDROID_STL=c++_shared'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
      version '3.22.1'
    }
  }

  buildFeatures {
    buildConfig true
  }

  packagingOptions {
    jniLibs {
      useLegacyPackaging false
    }
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  def media3Version = findProperty('reactNativeFastVideo_media3Version') ?: '1.11.0'

  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "androidx.media3:media3-datasource:${media3Version}"
  implementation "androidx.media3:media3-database:${media3Version}"
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-smoothstreaming:${media3Version}"
  implementation "androidx.media3:media3-datasource-okhttp:${media3Version}"
  implementation "androidx.media3:media3-ui:${media3Version}"
  implementation "androidx.media3:media3-session:${media3Version}"
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'

  testImplementation 'junit:junit:4.13.2'
}
